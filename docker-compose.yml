services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Secrets & base config loaded from backend/.env (not baked into images)
    env_file:
      - ./backend/.env
    # Container production overrides:
    # - DATABASE_URL points to persistent volume at /data/dev.db
    # - FRONTEND_URL matches the browser-facing origin (http://localhost:8080) for CORS
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/data/dev.db
      - FRONTEND_URL=http://localhost:8080
      - PORT=5000
    # NOTE: SQLite requires a single backend instance; do not scale backend with multiple replicas.
    volumes:
      - traveller_data:/data
    # Port 5000 is internal to Docker network; uncomment below only if direct host access to backend API is required:
    # ports:
    #   - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  traveller_data:
    name: traveller_data

